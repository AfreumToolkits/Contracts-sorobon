[package]
name = "limit-order-book-contract"
version = "0.1.0"
edition = "2021"
publish = false
description = "High-performance Limit Order Book for Soroban with gas-optimized matching engine"
license = "MIT"
author = "afreumtoolkits"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]